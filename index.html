<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ob-Havo Pro - Ob-havo Ma'lumotlari</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-globes">
    <div class="globe globe-1"></div>
    <div class="globe globe-2"></div>
  </div>

  <div class="weather-card">
    <header class="app-header">
      <div class="logo">
        <i class="fa-solid fa-cloud-sun-rain"></i>
        <span>ObHavo Pro</span>
      </div>
      <div class="search-box">
        <i class="fa-solid fa-location-dot search-icon"></i>
        <input type="text" id="cityInput" placeholder="Shahar nomini kiriting..." autocomplete="off">
        <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
    </header>

    <main class="weather-body" id="weatherBody">
      <!-- Dynamic Content Generated by JS -->
    </main>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>Ma'lumotlar yuklanmoqda...</p>
    </div>

    <div class="error-box" id="errorBox">
      <i class="fa-solid fa-circle-exclamation"></i>
      <p id="errorMessage">Shahar topilmadi. Qaytadan urinib ko'ring.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
